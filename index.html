<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">Local skies, clearly told</p>
      <div class="title-row">
        <h1>WeatherApp</h1>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button>
      </div>
      <p class="intro">A simple forecast for wherever you are headed next.</p>
    </header>

    <section class="weather-panel" aria-labelledby="weather-heading">
      <h2 id="weather-heading">Your forecast</h2>
      <button class="unit-toggle" id="unit-toggle" type="button" aria-pressed="false">Use °F</button>
      <form class="search-form" id="search-form">
        <label for="city-input">City</label>
        <div class="search-row">
          <input id="city-input" name="city" type="search" placeholder="Enter a city" autocomplete="address-level2" required>
          <button type="submit">Search</button>
        </div>
      </form>
      <p class="empty-state" aria-live="polite">Search for a city to see the latest weather.</p>
      <p class="status-message" id="status-message" role="status" hidden>Loading forecast...</p>
      <div class="current-weather" id="current-weather" hidden>
        <p class="location-name" id="location-name"></p>
        <p class="weather-icon" id="current-icon" aria-hidden="true"></p>
        <p class="current-temperature"><span id="temperature">--</span></p>
        <p id="condition">--</p>
        <p>Wind: <span id="wind-speed">--</span> km/h</p>
        <dl class="weather-details">
          <div><dt>Feels like</dt><dd><span id="feels-like">--</span></dd></div>
          <div><dt>Humidity</dt><dd><span id="humidity">--</span>%</dd></div>
          <div><dt>Precipitation</dt><dd><span id="precipitation">--</span> mm</dd></div>
        </dl>
      </div>
    </section>

    <section class="forecast-panel" aria-labelledby="forecast-heading" hidden>
      <h2 id="forecast-heading">Seven day forecast</h2>
      <div class="forecast-grid" id="forecast-grid"></div>
    </section>
  </main>
</body>
</html>
