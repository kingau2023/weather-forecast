<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">Local skies, clearly told</p>
      <h1>WeatherApp</h1>
      <p class="intro">A simple forecast for wherever you are headed next.</p>
    </header>

    <section class="weather-panel" aria-labelledby="weather-heading">
      <h2 id="weather-heading">Your forecast</h2>
      <p class="empty-state">Search for a city to see the latest weather.</p>
    </section>
  </main>
</body>
</html>
